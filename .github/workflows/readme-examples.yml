name: README examples

# Checks that the README's code examples work when copied as written:
# every code block must parse, and the full examples (Vite app, Next.js page)
# are built against this branch's packed package and opened in headless Chrome.

on:
  pull_request:
    branches:
      - master
      - 'RC-v*'
    paths:
      - 'Readme.md'
      - 'lib/**'
      - 'package.json'
      - 'webpack.config.js'
      - '.github/readme-check/**'
      - '.github/workflows/readme-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same steps as prepublishOnly: build, then copy the bundles to the
      # package root, so the packed package is what npm publish would ship.
      - name: Build the package
        run: |
          npm install --no-audit --no-fund
          npm run build
          bash lib/copy_bundles.sh

      - name: Pack the package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the checker
        working-directory: .github/readme-check
        run: |
          npm install --no-audit --no-fund
          npx puppeteer browsers install chrome

      - name: Check the README examples
        working-directory: .github/readme-check
        run: node check.mjs --package "$(ls "$RUNNER_TEMP"/react-froala-wysiwyg-*.tgz)"
