name: Sync Version – react SDK

on:
  repository_dispatch:
    types: [version_update]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Load version
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::Version is missing"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Using version $VERSION"

      - name: Compare current version
        id: compare
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)

          if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" = "null" ]; then
            echo "::error::Could not read the current version from package.json"
            exit 1
          fi

          echo "Current version: $CURRENT_VERSION"
          echo "Incoming version: $VERSION"

          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "The version is already up to date. No changes needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected. Continuing with release process."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release branch
        if: steps.compare.outputs.changed == 'true'
        run: |
          BRANCH="release-v${VERSION}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          git fetch origin

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Update package.json
        if: steps.compare.outputs.changed == 'true'
        run: |
          jq --arg VERSION "$VERSION" '.version = $VERSION | .dependencies["froala-editor"] = $VERSION' package.json > tmp.json
          mv tmp.json package.json

      - name: Commit changes
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "froala-travis-bot"
          git config user.email "froala_git_travis_bot@idera.com"
          git add package.json
          git commit -m "update package.json to v${VERSION}" || echo "Nothing to commit"
          git push origin "$BRANCH"

      - name: Create Pull Request
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_NOTES: ${{ github.event.client_payload.release_notes }}
        run: |
          git fetch origin master

          if git diff --quiet origin/master..."$BRANCH"; then
            echo "No commits between $BRANCH and master. Skipping PR creation."
            exit 0
          fi

          printf 'release: yes\n\n## Release Notes (from primary repo)\n\n%s\n' "$RELEASE_NOTES" \
            > "$RUNNER_TEMP/pr-body.md"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "A pull request for $BRANCH is already open."
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
